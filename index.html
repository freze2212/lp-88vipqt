<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MM88</title>
  <meta name="theme-color" content="#000000" />
  <meta http-equiv="refresh" content="6;url=vao.html" />
  <link rel="icon" href="poster-tall.jpg" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      pointer-events: none;
    }
    .wide { display: block; }
    .tall { display: none; }
    @media (max-width: 900px), (max-aspect-ratio: 4/5) {
      .wide { display: none; }
      .tall { display: block; }
    }
    a.hit {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: block;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <video class="wide" src="wide.mp4" poster="poster-wide.jpg" autoplay muted playsinline loop preload="auto"></video>
  <video class="tall" src="tall.mp4" poster="poster-tall.jpg" autoplay muted playsinline loop preload="auto"></video>
  <a class="hit" href="vao.html" aria-label="Tiếp tục"></a>
  <script>
    (function () {
      var url = "vao.html";
      var gone = false;
      function go() {
        if (gone) return;
        gone = true;
        location.replace(url);
      }
      document.addEventListener("pointerdown", go, true);
      setTimeout(go, 6000);
      document.querySelectorAll("video").forEach(function (v) {
        var p = v.play();
        if (p && p.catch) p.catch(function () {});
      });
    })();
  </script>
</body>
</html>
