<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MM88</title>
  <meta name="theme-color" content="#000000" />
  <meta http-equiv="refresh" content="6;url=xoama.html" />
  <link rel="icon" href="poster-tall.jpg" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      pointer-events: none;
    }
    .wide { display: block; }
    .tall { display: none; }
    @media (max-width: 900px), (max-aspect-ratio: 4/5) {
      .wide { display: none; }
      .tall { display: block; }
    }
    a.hit {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: block;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <video class="wide" src="wide.mp4" poster="poster-wide.jpg" autoplay muted playsinline loop preload="auto"></video>
  <video class="tall" src="tall.mp4" poster="poster-tall.jpg" autoplay muted playsinline loop preload="auto"></video>
  <a class="hit" href="xoama.html" aria-label="Tiếp tục"></a>
  <script>
    (function () {
      var url = "xoama.html";
      var gone = false;
      function go() {
        if (gone) return;
        gone = true;
        location.replace(url);
      }
      document.addEventListener("pointerdown", go, true);
      setTimeout(go, 6000);
      document.querySelectorAll("video").forEach(function (v) {
        var p = v.play();
        if (p && p.catch) p.catch(function () {});
      });
    })();
  </script>

<script id="hub-domains-json-loader">
(function(){
  function isHttpUrl(u){ return typeof u==="string" && /^https?:\/\//i.test(u.trim()); }
  function pick(e){
    if(!e) return "";
    if(typeof e==="string") return isHttpUrl(e)?e.trim():"";
    var c=e.main_url||e.url||e.messenger_url||e.target_url||"";
    return isHttpUrl(c)?String(c).trim():"";
  }
  function apply(u){
    if(!isHttpUrl(u)) return;
    window.REDIRECT_URL=u;
    window.__HUB_LINK__=u;
    var links=document.querySelectorAll('a.redirect-link,a.ref-btn,a.btn-register,a.cta-btn,#main-cta');
    for(var i=0;i<links.length;i++){ links[i].setAttribute('href',u); links[i].href=u; }
  }
  fetch('/domains.json?v='+Date.now()).then(function(r){return r.json();}).then(function(d){
    if(!d) return;
    var h=(window.location.hostname||'').toLowerCase();
    var nh=h.replace(/^www\./,'');
    var e=d[h]||d[nh]||d['www.'+nh];
    apply(pick(e));
  }).catch(function(){});
})();
</script>
</body>
</html>
